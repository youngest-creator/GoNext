<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><title>Вход — GoNext</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 60%, #0ea5e9 100%);
        }
        .card {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); padding: 36px; border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); width: 380px;
        }
        input { width: 100%; padding: 12px; margin: 6px 0 14px 0; border: 1.5px solid #cbd5e1; border-radius: 10px; box-sizing: border-box; }
        button {
            width: 100%; background: linear-gradient(135deg, #2563eb 0%, #0284c7 100%); color: white; border: none;
            padding: 13px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer;
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin:0; color:#1e3a8a;">🧭 Вход в GoNext</h2>
        <p style="font-size:13px; color:#64748b; margin-top:4px;">Разработчик: Максим Фирсов</p>
        <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Войти в аккаунт</button></form>
        <p style="text-align:center; margin-top:18px; font-size:14px;"><a href="{% url 'index' %}" style="color:#2563eb; text-decoration:none; font-weight:600;">← Вернуться на главную</a></p>
    </div>
</body>
</html>
